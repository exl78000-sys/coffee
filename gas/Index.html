<!DOCTYPE html>

<style>
:root {
  --bg: #f7f1ea;
  --surface: #fffdfa;
  --surface-2: #f1e8de;
  --text: #2b211b;
  --muted: #85766a;
  --line: #e6dace;
  --accent: #8a5426;
  --accent-text: #fff;
  --accent-soft: #f3e2d0;
  --gold: #c58a1d;
  --danger: #b4412f;
  --warn-bg: #fdf0d8;
  --pourover: #8a5426;
  --immersion: #5e7a4a;
  --espresso: #6b3a2a;
  --moka: #3f6377;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 2px 8px rgba(60, 40, 20, .05);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1613;
    --surface: #251e1a;
    --surface-2: #2f2621;
    --text: #f1e8df;
    --muted: #a8988a;
    --line: #3a2f29;
    --accent: #d39a62;
    --accent-text: #1b1613;
    --accent-soft: #3b2c21;
    --gold: #e2ac45;
    --danger: #e0715f;
    --warn-bg: #3d3018;
    --pourover: #d39a62;
    --immersion: #9cbc84;
    --espresso: #d08a72;
    --moka: #84b3cc;
    --shadow: none;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #1b1613;
  --surface: #251e1a;
  --surface-2: #2f2621;
  --text: #f1e8df;
  --muted: #a8988a;
  --line: #3a2f29;
  --accent: #d39a62;
  --accent-text: #1b1613;
  --accent-soft: #3b2c21;
  --gold: #e2ac45;
  --danger: #e0715f;
  --warn-bg: #3d3018;
  --pourover: #d39a62;
  --immersion: #9cbc84;
  --espresso: #d08a72;
  --moka: #84b3cc;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
}

a { color: var(--accent); }

h1, h2 { margin: 0; line-height: 1.3; }
h1 { font-size: 1.35rem; }
h2 { font-size: 1.02rem; margin-bottom: .6rem; }

.page {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 16px 24px;
}

/* ---------- 頁首 ---------- */

.top {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(12px + env(safe-area-inset-top)) 0 12px;
  background: var(--bg);
}
.top h1 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back {
  font-size: 2rem;
  line-height: 1;
  text-decoration: none;
  padding: 0 8px 4px 0;
}

.sub { margin: -4px 0 10px; }

/* ---------- 卡片與列表 ---------- */

.card {
  display: block;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  color: inherit;
  text-decoration: none;
}
a.card:active { transform: scale(.99); }

.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: .6rem; }
.card-head h2 { margin: 0; }

.list { display: flex; flex-direction: column; }
.list .card { margin-bottom: 10px; }
.list.tight { gap: 0; }

.item {
  display: flex;
  flex-direction: column;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  color: inherit;
  text-decoration: none;
}
.item:last-child { border-bottom: 0; }

.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.meta { margin: 4px 0; font-size: .92rem; color: var(--text); opacity: .85; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.center { text-align: center; }
.mono { font-variant-numeric: tabular-nums; }
.r { text-align: right; }

.brew-card .row:first-child strong,
.bean-card strong { font-size: 1.02rem; }
.bean-card.archived { opacity: .55; }

.section-title { margin: 20px 0 10px; font-size: .95rem; color: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 32px 8px; }

.tag {
  display: inline-block;
  font-size: .75rem;
  padding: 1px 8px;
  border-radius: 99px;
  background: var(--surface-2);
  color: var(--text);
  white-space: nowrap;
}
.tag.m-pourover { background: color-mix(in srgb, var(--pourover) 16%, transparent); color: var(--pourover); }
.tag.m-immersion { background: color-mix(in srgb, var(--immersion) 18%, transparent); color: var(--immersion); }
.tag.m-espresso { background: color-mix(in srgb, var(--espresso) 18%, transparent); color: var(--espresso); }
.tag.m-moka { background: color-mix(in srgb, var(--moka) 18%, transparent); color: var(--moka); }

.best { color: var(--gold); font-size: .82rem; font-weight: 600; }
.stars { color: var(--gold); letter-spacing: 1px; }
.stars .off { color: var(--line); }
.big-stars { font-size: 1.4rem; margin-bottom: 6px; }

.note {
  background: var(--warn-bg);
  border-radius: 10px;
  padding: 8px 10px;
  margin: 8px 0;
  font-size: .92rem;
}

/* ---------- 統計格 ---------- */

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 12px 16px;
}
.stats div { display: flex; flex-direction: column; min-width: 0; }
.stats span { font-size: .78rem; color: var(--muted); }
.stats b { font-weight: 600; overflow-wrap: anywhere; }

.bars { display: grid; gap: 6px; margin: 8px 0 12px; }
.bar { display: grid; grid-template-columns: 3em 1fr 1.5em; align-items: center; gap: 8px; font-size: .9rem; }
.bar .track { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar .track div { height: 100%; background: var(--accent); border-radius: 99px; }

/* ---------- 表格 ---------- */

.table { width: 100%; border-collapse: collapse; font-size: .9rem; margin: 6px 0; }
.table th { text-align: left; font-weight: 500; color: var(--muted); font-size: .78rem; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.table td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table th.r, .table td.r { text-align: right; white-space: nowrap; }
.table tr.hl td { background: var(--accent-soft); }
.scroll-x { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
.scroll-x .table { min-width: max-content; }

/* ---------- 按鈕 ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 42px;
  padding: 8px 16px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.danger-fill { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: .88rem; }
.btn.block { display: flex; width: 100%; margin-top: 8px; }
.btn.big { min-height: 64px; min-width: 120px; font-size: 1.2rem; border-radius: 99px; }
.btn:disabled { opacity: .45; }

.icon-btn {
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 1.05rem;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
}

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px 10px; padding: 0 16px; scrollbar-width: none; }
.chip {
  flex: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  border-radius: 99px;
  padding: 5px 13px;
  font: inherit;
  font-size: .88rem;
  text-decoration: none;
  cursor: pointer;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

/* ---------- 表單 ---------- */

.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; min-width: 0; }
.field > span { font-size: .8rem; color: var(--muted); }

input, select, textarea, output {
  font: inherit;
  color: inherit;
  width: 100%;
  min-width: 0;
}
input, select, textarea {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 10px;
  min-height: 42px;
}
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 0; border-color: var(--accent); }
textarea { resize: vertical; }
output { display: block; padding: 9px 0; font-variant-numeric: tabular-nums; font-weight: 600; }
input[type="checkbox"] { width: auto; min-height: 0; accent-color: var(--accent); }
input[type="range"] { padding: 0; border: 0; background: none; accent-color: var(--accent); min-height: 30px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 10px; }

.hint { font-size: .88rem; color: var(--muted); margin: -2px 0 10px; }
.hint > * + * { margin-top: 6px; }
.hint:empty { display: none; }
.hint b { color: var(--text); }
.hint.warn { color: var(--danger); }
.hint .btn { display: flex; justify-content: flex-start; color: var(--text); text-align: left; height: auto; }

.check { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
.center-check { display: flex; justify-content: center; margin: 12px 0; }

.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  background: var(--surface-2);
  border-radius: 12px;
  padding: 3px;
  margin-bottom: 12px;
}
.seg label, .seg a { position: relative; text-align: center; }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; margin: 0; opacity: 0; pointer-events: none; }
.seg span, .seg a {
  display: block;
  padding: 7px 4px;
  border-radius: 9px;
  font-size: .92rem;
  cursor: pointer;
  color: var(--text);
  text-decoration: none;
}
.seg input:checked + span, .seg a.on { background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }

.stage {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 10px;
  margin-bottom: 8px;
  background: var(--bg);
}
.stage-line { display: flex; align-items: center; gap: 8px; }
.stage-no {
  flex: none;
  width: 26px; height: 26px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: .85rem;
  font-weight: 700;
}
.mini { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; }
.mini input { text-align: right; font-variant-numeric: tabular-nums; }
.mini span { flex: none; font-size: .85rem; color: var(--muted); }
.stage input { background: var(--surface); }
.stage-line .icon-btn { flex: none; width: 32px; }
.stage-line .icon-btn[aria-expanded="true"] { color: var(--accent); }
.stage-sub { margin: 4px 0 0 34px; }
.stage-sub:empty { display: none; }
.stage-more { display: grid; gap: 6px; margin: 8px 0 2px 34px; }
.stage-help { margin: -4px 0 10px; }
.diff-table { table-layout: fixed; }
.diff-table th:first-child, .diff-table td:first-child { width: 5.5em; }
.diff-table td { overflow-wrap: anywhere; }
.suggest-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.suggest-row select { flex: 1; min-height: 34px; padding: 4px 8px; font-size: .88rem; }

.compare .table { min-width: max-content; }
.compare th, .compare td { white-space: nowrap; max-width: 14em; overflow: hidden; text-overflow: ellipsis; }
.compare tbody th { color: var(--muted); font-weight: 500; text-align: left; position: sticky; left: 0; background: var(--bg); }
.compare td.chg, .chg-key { background: var(--warn-bg); }
.chg-key { padding: 0 4px; border-radius: 4px; }
.compare .bestcol { box-shadow: inset 2px 0 0 var(--gold), inset -2px 0 0 var(--gold); }

details.tpl { margin-top: 10px; }
details.tpl summary { cursor: pointer; font-size: .88rem; color: var(--muted); padding: 4px 0; }
details.tpl .chips { margin: 8px 0 0; }
.recipe-picks { display: grid; gap: 6px; margin-top: 8px; }
.recipe-pick {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  text-align: left;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  cursor: pointer;
}
.recipe-pick:active { transform: scale(.99); }
.recipe-pick:focus-visible { outline: 2px solid var(--accent); }

.bean-photo {
  display: block;
  width: 100%;
  max-height: 320px;
  object-fit: contain;
  border-radius: 10px;
  background: var(--surface-2);
  margin-bottom: 12px;
}
.photo-empty {
  border: 1.5px dashed var(--line);
  border-radius: 10px;
  padding: 22px 14px;
  text-align: center;
  color: var(--muted);
  font-size: .9rem;
}
.bean-card { display: flex; gap: 12px; align-items: flex-start; }
.thumb {
  flex: none;
  width: 56px; height: 56px;
  object-fit: cover;
  border-radius: 10px;
  background: var(--surface-2);
}
input.filled, select.filled, textarea.filled { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--bg)); }

.star-input { display: flex; gap: 4px; margin-bottom: 8px; }
.star {
  font-size: 2rem;
  line-height: 1;
  border: 0;
  background: none;
  color: var(--line);
  cursor: pointer;
  padding: 2px;
}
.star.on { color: var(--gold); }

.slider { display: grid; grid-template-columns: 3em 1fr 1.5em; align-items: center; gap: 8px; margin-bottom: 4px; }
.slider output { padding: 0; text-align: center; }

.form-actions {
  position: sticky;
  bottom: calc(64px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 10px 0;
  background: linear-gradient(to bottom, transparent, var(--bg) 30%);
}
.form-actions .btn.primary { min-width: 120px; }
.form-actions .danger { margin-right: auto; }

.filter { margin-bottom: 12px; }

/* ---------- 計時器 ---------- */

.clock {
  font-size: clamp(4rem, 22vw, 6.5rem);
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  margin: 8px 0;
  letter-spacing: -.02em;
}
.clock.over { color: var(--danger); }

.now { border-color: var(--accent); background: var(--accent-soft); }
.now-label { font-size: 1.35rem; font-weight: 700; }
.now-amount { font-size: 1.1rem; margin: 4px 0; }
.now-amount b { font-size: 1.5rem; }
.now-end { font-size: 1rem; margin: 2px 0 4px; }
.now-end b { font-size: 1.3rem; }
.now-tech { font-size: 1rem; }
.now-next { margin-top: 8px; font-size: .9rem; color: var(--muted); }

.timer-controls { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 16px 0; }

.stage-list { list-style: none; padding: 0; margin: 0 0 12px; }
.stage-list li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid transparent;
}
.stage-list li small { display: block; color: var(--muted); font-size: .8rem; font-weight: 400; }
.stage-list li .stage-no { margin-top: 1px; }
.stage-list li.active { background: var(--surface); border-color: var(--accent); font-weight: 600; }
.stage-list li.done { opacity: .45; }

.link-card strong { font-size: 1.05rem; }

/* ---------- 底部導覽 ---------- */

.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 10;
  display: flex;
  justify-content: center;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar a {
  flex: 1;
  max-width: 136px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 0 6px;
  color: var(--muted);
  text-decoration: none;
  font-size: .72rem;
  -webkit-tap-highlight-color: transparent;
}
.tabbar svg {
  width: 24px; height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.tabbar a.active { color: var(--accent); font-weight: 600; }

/* ---------- 確認視窗 ---------- */

.modal {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 16px;
  background: color-mix(in srgb, var(--text) 45%, transparent);
}
.modal-box {
  width: 100%;
  max-width: 400px;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
}
.modal-box p { margin: 0 0 14px; }
.modal-box textarea { font-family: ui-monospace, Menlo, monospace; font-size: .78rem; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

.btn:focus-visible, .chip:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .toast { transition: none; }
  .btn:active, a.card:active { transform: none; }
}

/* ---------- 提示 ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: 99px;
  font-size: .9rem;
  opacity: 0;
  transition: .25s;
  z-index: 20;
  max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 380px) {
  .grid3 { grid-template-columns: 1fr 1fr; }
}

/*
 * 純計算函式：水粉比、分段縮放、研磨刻度換算、沖煮範本。
 * 同時支援瀏覽器（掛在 window.Calc）與 Node（module.exports，供測試使用）。
 */
(function (root, factory) {

    const a = parseTime(actualTime);
    if (t === null || a === null) return null;
    const diff = a - t;
    if (Math.abs(diff) <= 15) return { diff, level: 'ok', text: '總時間在目標範圍內' };
    return diff > 0
      ? { diff, level: 'slow', text: `比目標慢 ${diff} 秒，下次可以磨粗一點` }
      : { diff, level: 'fast', text: `比目標快 ${-diff} 秒，下次可以磨細一點` };
  }

  // ---------- 豆子 ----------

  /** 養豆天數（沖煮日 − 烘焙日） */
  function restDays(roastDate, brewDate) {

    const b = brewDate ? new Date(String(brewDate).slice(0, 10) + 'T00:00:00') : new Date();

    if (!brewDate) b.setHours(0, 0, 0, 0);

<script>
/*
 * 資料層。三種後端：
 *   - sheet：Google 試算表（App 由 Google Apps Script 提供時）。三個分頁一列一筆，欄位可直接閱讀
 *   - db：claude.ai 頁面的雲端資料庫（每筆資料一份文件：beans/<id>、grinders/<id>、brews/<id>）
 *   - local：瀏覽器 localStorage（直接開檔 / 一般網址）
 * 讀取一律走記憶體中的 state，寫入時同步存回後端。
 */
(function (root) {
  'use strict';

  const KEY = 'coffee-log-v1';
  const COLLECTIONS = ['beans', 'grinders', 'brews'];
  const MODE = root.COFFEE_MODE || 'web';

  function empty() {
    return { version: 1, beans: [], grinders: [], brews: [] };
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function plain(o) {
    return JSON.parse(JSON.stringify(o));
  }

  function normalize(data) {
    const s = empty();
    if (data && typeof data === 'object') {
      COLLECTIONS.forEach((c) => {
        if (Array.isArray(data[c])) s[c] = data[c].filter((x) => x && x.id && /^[A-Za-z0-9_.~:@+-]+$/.test(x.id));
      });
    }
    return s;
  }

  // ---------- Google 試算表欄位對應 ----------

  const METHOD_LABELS = { pourover: '手沖', immersion: '浸泡式', espresso: '義式', moka: '摩卡壺' };
  const EXTRA = '其他資料（請勿修改）';

  // [欄位, 表頭, 型別]；型別：text（預設）、num、bool、method、date、day；derived:* 為唯讀摘要欄
  const SHEET_COLUMNS = {
    beans: [
      ['id', 'id'], ['name', '名稱'], ['roaster', '烘豆商'], ['origin', '產區'], ['variety', '品種'],
      ['process', '處理法'], ['roast', '烘焙度'], ['roastDate', '烘焙日', 'day'], ['weight', '重量 g', 'num'],
      ['price', '價格'], ['flavor', '風味標示'], ['notes', '備註'], ['archived', '已喝完', 'bool'],
    ],
    grinders: [
      ['id', 'id'], ['name', '名稱'], ['unit', '刻度單位'], ['micronsPerStep', '每格 µm', 'num'],
      ['zeroMicrons', '零點 µm', 'num'], ['precision', '刻度精度', 'num'], ['notes', '備註'],
    ],
    brews: [
      ['id', 'id'], ['date', '日期', 'date'], ['method', '沖煮法', 'method'], [null, '豆子', 'derived:bean'],
      [null, '磨豆機', 'derived:grinder'], ['grindSetting', '刻度'], ['dose', '粉量 g', 'num'],
      ['ratio', '水粉比 1:', 'num'], ['water', '水量 g', 'num'], ['yield', '萃取量 g', 'num'],
      ['temp', '水溫 °C', 'num'], ['totalTime', '總時間'], ['targetTime', '目標時間'], [null, '分段', 'derived:stages'], ['dripper', '器具'],
      ['rating', '評分', 'num'], ['acidity', '酸', 'num'], ['sweetness', '甜', 'num'], ['bitterness', '苦', 'num'],
      ['body', '醇厚', 'num'], ['flavorNotes', '風味描述'], ['notes', '心得'], ['nextTime', '下次調整'],
      ['isBest', '最佳配方', 'bool'], ['recipeName', '參考配方'],
    ],
  };

  function sheetColumns(collection) {
    return SHEET_COLUMNS[collection].map(([, header, type]) => ({ header, text: type !== 'num' }))
      .concat([{ header: EXTRA, text: true }]);
  }

  function fmtSec(sec) {
    return Math.floor(sec / 60) + ':' + String(Math.round(sec % 60)).padStart(2, '0');
  }

  /** 記錄 → { 表頭: 值 }。對應不到欄位的資料（分段、器材細節等）放進最後的 JSON 欄 */
  function toRow(collection, obj, state) {
    const row = {};
    const extra = plain(obj);
    SHEET_COLUMNS[collection].forEach(([key, header, type]) => {
      if (!key) {
        if (type === 'derived:bean') {
          const b = state.beans.find((x) => x.id === obj.beanId);
          row[header] = b ? b.name : obj.beanName || '';
        } else if (type === 'derived:grinder') {
          const g = state.grinders.find((x) => x.id === obj.grinderId);
          row[header] = g ? g.name : obj.grinderName || '';
        } else if (type === 'derived:stages') {
          row[header] = (obj.stages || []).map((s, i) =>
            `${i + 1}. ${s.amount ? s.amount + 'g' : '—'}${typeof s.end === 'number' ? ' → ' + fmtSec(s.end) : ''}${s.technique ? ' ' + s.technique : ''}`).join('\n');
        }
        return;
      }
      const v = obj[key];
      delete extra[key];
      if (type === 'bool') row[header] = v ? '是' : '';
      else if (type === 'method') row[header] = METHOD_LABELS[v] || v || '';
      else if (type === 'date') row[header] = v ? String(v).replace('T', ' ') : '';
      else row[header] = v === null || v === undefined ? '' : v;
    });
    delete extra.photo; // 照片另存，不放進儲存格
    row[EXTRA] = JSON.stringify(extra);
    return row;
  }

  /** 試算表的一列 → 記錄；使用者在試算表裡改過的欄位以試算表為準 */
  function fromRow(collection, headers, values) {
    const at = {};
    headers.forEach((h, i) => { at[String(h)] = i; });
    const cell = (h) => (at[h] === undefined ? undefined : values[at[h]]);
    const id = String(cell('id') || '').trim();
    if (!id) return null;
    let obj = {};
    try { obj = JSON.parse(cell(EXTRA) || '{}') || {}; } catch (e) { obj = {}; }
    obj.id = id;
    SHEET_COLUMNS[collection].forEach(([key, header, type]) => {
      if (!key || key === 'id') return;
      const v = cell(header);
      if (v === undefined) return; // 欄位被刪掉：保留 JSON 裡的值
      if (v === '' || v === null) { delete obj[key]; return; }
      const t = String(v).trim();
      if (type === 'num') {
        const n = typeof v === 'number' ? v : parseFloat(t.replace(',', '.'));
        if (Number.isFinite(n)) obj[key] = n; else delete obj[key];
      } else if (type === 'bool') {
        obj[key] = !['', '否', 'false', 'FALSE', '0'].includes(t);
      } else if (type === 'method') {
        obj[key] = Object.keys(METHOD_LABELS).find((k) => METHOD_LABELS[k] === t) || (METHOD_LABELS[t] ? t : obj.method || 'pourover');
      } else if (type === 'date') {
        obj[key] = t.length <= 10 ? t.slice(0, 10) + 'T00:00' : t.replace(' ', 'T').slice(0, 16);
      } else if (type === 'day') {
        obj[key] = t.slice(0, 10);
      } else {
        obj[key] = t;
      }
    });
    return obj;
  }

  function parseSheets(data) {
    const s = empty();
    COLLECTIONS.forEach((c) => {
      const rows = (data && data[c]) || [];
      if (!rows.length) return;
      const headers = rows[0];
      s[c] = rows.slice(1).map((r) => fromRow(c, headers, r)).filter(Boolean);
    });
    return s;
  }

  /** 呼叫 Apps Script 伺服器端函式 */
  function gas(fn, ...args) {
    return new Promise((resolve, reject) => {
      root.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }

  /** 等待 claude.ai 頁面提供的 window.claude（一般網頁上不存在，直接回傳 null） */
  async function claudeDb() {
    if (MODE !== 'claude') return null;
    for (let i = 0; i < 20 && !(root.claude && root.claude.use); i++) {
      await new Promise((r) => setTimeout(r, 100));
    }
    if (!(root.claude && root.claude.use)) return null;
    try { return await root.claude.use('db'); } catch (e) { return null; }
  }

  const Store = {
    state: empty(),
    backend: 'local',
    db: null,
    /** 寫入失敗時呼叫，由畫面層設定 */
    onError: (msg) => console.error(msg),
    chains: {},
    gas,

    async init() {
      if (MODE === 'gas' && root.google && root.google.script) {
        try {
          this.state = parseSheets(await gas('loadAll'));
          this.backend = 'sheet';
          return;
        } catch (e) {
          this.onError('讀取 Google 試算表失敗：' + ((e && e.message) || e));
        }
      }
      const db = await claudeDb();
      if (db) {
        try {
          const s = empty();
          for (const c of COLLECTIONS) {
            const snap = await db.collection(c).limit(1000).get();
            s[c] = snap.docs.map((d) => plain(d.data()));
          }
          this.state = s;
          this.db = db;
          this.backend = 'db';
          return;
        } catch (e) {
          this.onError('雲端資料載入失敗，暫時改用這台裝置的瀏覽器儲存。');
        }
      }
      this.loadLocal();
    },

    loadLocal() {
      try {
        const raw = localStorage.getItem(KEY);
        this.state = raw ? normalize(JSON.parse(raw)) : empty();
      } catch (e) {
        this.state = empty();
      }
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(() => {});
      }
    },

    saveLocal() {
      try {
        localStorage.setItem(KEY, JSON.stringify(this.state));
      } catch (e) {
        this.onError('儲存失敗：' + e.message + '。建議先到「設定」匯出備份。');
      }
    },

    /** 同一份資料的寫入依序執行，避免互相覆蓋 */
    queue(path, fn) {
      const prev = this.chains[path] || Promise.resolve();
      const next = prev.then(fn).catch((e) => {
        const code = e && e.code;
        this.onError(code === 'quota_exceeded' ? '雲端空間已滿，請刪除一些舊記錄。' : '儲存失敗：' + ((e && e.message) || code || e));
      });
      this.chains[path] = next;
      return next;
    },

    persist(collection, obj) {
      if (this.backend === 'sheet') {
        const row = toRow(collection, obj, this.state);
        return this.queue(collection + '/' + obj.id, () => gas('saveRecords', collection, sheetColumns(collection), [row]));
      }
      if (this.backend !== 'db') return this.saveLocal();
      const data = plain(obj);
      return this.queue(collection + '/' + obj.id, () => this.db.doc(collection + '/' + obj.id).set(data));
    },

    /** 多筆一次寫入（試算表一次呼叫；其他後端逐筆） */
    persistMany(collection, list) {
      if (!list.length) return Promise.resolve();
      if (this.backend === 'sheet') {
        const rows = list.map((o) => toRow(collection, o, this.state));
        return this.queue(collection + '/*', () => gas('saveRecords', collection, sheetColumns(collection), rows));
      }
      list.forEach((o) => this.persist(collection, o));
      return this.flush();
    },

    unpersist(collection, id) {
      if (this.backend === 'sheet') return this.queue(collection + '/' + id, () => gas('deleteRecords', collection, [id]));
      if (this.backend !== 'db') return this.saveLocal();
      return this.queue(collection + '/' + id, () => this.db.doc(collection + '/' + id).delete());
    },

    /** 等待所有尚未完成的寫入 */
    flush() {
      return Promise.all(Object.values(this.chains));
    },

    uid,

    all(collection) {
      return this.state[collection];
    },

    get(collection, id) {
      return this.state[collection].find((x) => x.id === id) || null;
    },

    upsert(collection, obj) {
      const list = this.state[collection];
      const now = new Date().toISOString();
      if (!obj.id) {
        obj.id = uid();
        obj.createdAt = now;
      }
      obj.updatedAt = now;
      const i = list.findIndex((x) => x.id === obj.id);
      const renamed = i >= 0 && list[i].name !== obj.name;
      if (i >= 0) list[i] = obj;
      else list.push(obj);
      this.persist(collection, obj);
      // 試算表的記錄列會顯示豆子 / 磨豆機名稱，改名時一併更新
      if (renamed && this.backend === 'sheet' && (collection === 'beans' || collection === 'grinders')) {
        const key = collection === 'beans' ? 'beanId' : 'grinderId';
        this.persistMany('brews', this.state.brews.filter((b) => b[key] === obj.id));
      }
      return obj;
    },

    remove(collection, id) {
      this.state[collection] = this.state[collection].filter((x) => x.id !== id);
      this.unpersist(collection, id);
    },

    /** 同一支豆子、同一種沖煮法只保留一個「最佳配方」 */
    toggleBest(brewId) {
      const brew = this.get('brews', brewId);
      if (!brew) return;
      const next = !brew.isBest;
      const changed = [];
      this.state.brews.forEach((b) => {
        if (b.beanId === brew.beanId && b.method === brew.method && b.isBest && b !== brew) {
          b.isBest = false;
          changed.push(b);
        }
      });
      brew.isBest = next;
      changed.push(brew);
      this.persistMany('brews', changed);
    },

    exportJSON() {
      return JSON.stringify(
        Object.assign({ exportedAt: new Date().toISOString() }, this.state),
        null,
        2
      );
    },

    /** mode: 'merge'（同 id 以匯入檔為準）或 'replace'（整個取代） */
    async importJSON(text, mode) {
      const incoming = normalize(JSON.parse(text));
      if (this.backend === 'sheet') {
        // 一般網頁版備份裡的照片是 data URL，改存到試算表的照片分頁
        for (const b of incoming.beans) {
          if (b.photo && String(b.photo).startsWith('data:image/')) {
            try { b.photoKey = await gas('savePhoto', b.photo); } catch (e) { /* 略過照片 */ }
            delete b.photo;
          }
        }
        if (mode === 'replace') { await gas('clearAll'); this.state = empty(); }
      } else if (mode === 'replace') {
        COLLECTIONS.forEach((c) => {
          this.state[c].forEach((x) => { if (!incoming[c].some((y) => y.id === x.id)) this.unpersist(c, x.id); });
        });
      }
      COLLECTIONS.forEach((c) => {
        const map = new Map((mode === 'replace' ? [] : this.state[c]).map((x) => [x.id, x]));
        incoming[c].forEach((x) => map.set(x.id, x));
        this.state[c] = Array.from(map.values());
      });
      if (this.backend === 'sheet') {
        for (const c of COLLECTIONS) await this.persistMany(c, incoming[c]);
      } else if (this.backend === 'db') {
        COLLECTIONS.forEach((c) => incoming[c].forEach((x) => this.persist(c, x)));
      } else {
        this.saveLocal();
      }
      await this.flush();
      return COLLECTIONS.reduce((n, c) => n + incoming[c].length, 0);
    },

    async clear() {
      if (this.backend === 'sheet') {
        await gas('clearAll');
      } else {
        COLLECTIONS.forEach((c) => this.state[c].forEach((x) => this.unpersist(c, x.id)));
      }
      this.state = empty();
      if (this.backend === 'local') this.saveLocal();
      await this.flush();
    },
  };

  // 測試用
  Store._sheet = { toRow, fromRow, parseSheets, SHEET_COLUMNS, EXTRA };
  root.Store = Store;
})(typeof self !== 'undefined' ? self : this);

  function stars(n) {
    if (!n) return '<span class="muted">未評分</span>';
    return '<span class="stars">' + '★'.repeat(n) + '<span class="off">' + '★'.repeat(5 - n) + '</span></span>';
  }

  function mount(html) {
    view.innerHTML = html;
    hydratePhotos(view);
    return view.firstElementChild;
  }

  function header(title, opts) {
    opts = opts || {};
    return `<header class="top">
      ${opts.back ? `<a class="back" href="${opts.back}" aria-label="返回">‹</a>` : ''}
      <h1>${esc(title)}</h1>
      ${opts.action || ''}
    </header>`;
  }

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.classList.add('show'), 10);
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2200);
  }

  function notFound() {
    mount(`<div class="page">${header('找不到', { back: '#/brews' })}<p class="empty">這筆資料不存在或已被刪除。</p></div>`);
  }

  function field(label, input, cls) {
    return `<label class="field ${cls || ''}"><span>${label}</span>${input}</label>`;
  }

  function numInput(f, value, extra) {
    return `<input type="number" step="any" inputmode="decimal" data-f="${f}" value="${esc(value)}" ${extra || ''}>`;
  }

  function go(h, replace) {
    if (EMBED) { currentHash = h; route(); return; }
    if (location.hash === h) route();
    else if (replace) location.replace(h);
    else location.hash = h;
  }

  /** 頁面內的確認視窗（claude.ai 頁面不允許瀏覽器原生 confirm） */
  function ask(message, okLabel, danger) {
    return new Promise((resolve) => {
      const wrap = document.createElement('div');
      wrap.className = 'modal';
      wrap.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true">
        <p>${esc(message)}</p>
        <div class="modal-actions">
          <button type="button" class="btn ghost" data-v="0">取消</button>
          <button type="button" class="btn ${danger ? 'danger-fill' : 'primary'}" data-v="1">${esc(okLabel || '確定')}</button>
        </div></div>`;
      const done = (v) => { wrap.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
      const onKey = (e) => { if (e.key === 'Escape') done(false); };
      wrap.addEventListener('click', (e) => {
        const b = e.target.closest('[data-v]');
        if (b) done(b.dataset.v === '1');
        else if (e.target === wrap) done(false);
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(wrap);
      wrap.querySelector('[data-v="1"]').focus();
    });
  }

  /** 顯示一段可複製的文字（下載不可用時的備案） */
  function showText(title, text) {
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = `<div class="modal-box">
      <p><b>${esc(title)}</b></p>
      <textarea id="copy-text" rows="10" readonly></textarea>
      <div class="modal-actions">
        <button type="button" class="btn ghost" data-v="close">關閉</button>
        <button type="button" class="btn primary" data-v="copy">複製</button>
      </div></div>`;
    $('#copy-text', wrap).value = text;
    wrap.addEventListener('click', (e) => {
      const b = e.target.closest('[data-v]');
      if (!b && e.target !== wrap) return;
      if (b && b.dataset.v === 'copy') {
        const ta = $('#copy-text', wrap);
        const fallback = () => { ta.focus(); ta.select(); toast('已選取，請手動複製'); };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('已複製'), fallback);
        else fallback();
        return;
      }
      wrap.remove();
    });
    document.body.appendChild(wrap);
  }

  // ---------- 資料輔助 ----------

  function unitOf(g) {
    return g && g.unit !== undefined && g.unit !== null ? g.unit : '格';
  }

  /** 記錄上的豆子名稱：常用豆子，或沒加入常用時直接輸入的名稱 */
  function brewBeanName(b) {
    const bean = S.get('beans', b.beanId);
    return bean ? bean.name : b.beanName || '未指定豆子';
  }

  function grindText(b) {
    const g = S.get('grinders', b.grinderId);
    const name = g ? g.name : b.grinderName || '';
    if (!name && !b.grindSetting) return '';
    return [name, b.grindSetting ? b.grindSetting + ' ' + unitOf(g) : ''].filter(Boolean).join(' ').trim();
  }

  function findByName(collection, name) {
    const n = String(name || '').trim().toLowerCase();
    return n ? S.all(collection).find((x) => String(x.name || '').trim().toLowerCase() === n) || null : null;
  }

  function presetByName(name) {
    const n = String(name || '').trim().toLowerCase();
    return C.GRINDER_PRESETS.find((p) => p.name.toLowerCase() === n) || null;
  }

  function hasPhoto(bean) {
    return !!(bean && (bean.photoId || bean.photoKey || bean.photo));
  }

  /** 豆子照片的 <img>；存在試算表的照片先放空殼，之後由 hydratePhotos 載入 */
  function photoImg(bean, cls, alt) {
    if (!hasPhoto(bean)) return '';
    if (bean.photoKey) return `<img class="${cls}" data-sheet-photo="${esc(bean.photoKey)}" alt="${esc(alt)}">`;
    const src = bean.photoId ? '/_blob/' + bean.photoId : bean.photo;
    return `<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`;
  }

  const photoCache = {};
  function hydratePhotos(scope) {
    if (!SHEET) return;
    $$('img[data-sheet-photo]:not([src])', scope).forEach((img) => {
      const key = img.dataset.sheetPhoto;
      const p = photoCache[key] || (photoCache[key] = S.gas('getPhoto', key).catch(() => ''));
      p.then((src) => { if (src) img.src = src; else img.remove(); });
    });
  }

  function summary(b) {
    const m = METHODS[b.method] || METHODS.pourover;
    const out = b[m.out];
    return [
      b.dose ? b.dose + 'g' : '',
      b.ratio ? '1:' + b.ratio : '',
      out ? (m.out === 'yield' ? '出 ' : '') + out + 'g' : '',
      grindText(b),
      b.totalTime || '',
    ].filter(Boolean).join(' · ');
  }

  function beanBrews(beanId) {
    return S.all('brews').filter((b) => b.beanId === beanId).sort(byDateDesc);
  }

  /** 明確標記的最佳配方優先，否則取評分最高（同分取最新） */
  function bestBrew(beanId, method, excludeId) {
    const list = beanBrews(beanId).filter((b) => (!method || b.method === method) && b.id !== excludeId);
    return list.find((b) => b.isBest) || list.filter((b) => b.rating).sort((a, b) => b.rating - a.rating)[0] || null;
  }

  function remaining(bean) {
    const w = C.num(bean.weight);
    if (w === null) return null;
    const used = beanBrews(bean.id).reduce((s, b) => s + (C.num(b.dose) || 0), 0);
    return Math.max(0, C.round(w - used, 0.1));
  }

  function methodTag(m) {
    return `<span class="tag m-${esc(m)}">${esc((METHODS[m] || METHODS.pourover).label)}</span>`;
  }

  function brewCard(b, opts) {
    opts = opts || {};
    return `<a class="card brew-card" href="#/brew/${b.id}">
      <div class="row">${methodTag(b.method)}<strong class="grow">${esc(opts.hideBean ? fmtDate(b.date) : brewBeanName(b))}</strong>${b.isBest ? '<span class="best">★ 最佳</span>' : ''}</div>
      <div class="meta">${esc(summary(b)) || '<span class="muted">沒有參數</span>'}</div>
      <div class="row">${stars(b.rating)}<span class="muted small">${opts.hideBean ? '' : esc(fmtDate(b.date))}</span></div>
    </a>`;
  }

  function adviceLine(b) {
    const adv = C.timeAdvice(b.targetTime, b.totalTime);
    if (!adv) return '';
    return `<p class="${adv.level === 'ok' ? 'muted small' : 'note'}">目標 ${esc(b.targetTime)}，實際 ${esc(b.totalTime)}：${esc(adv.text)}</p>`;
  }

  // ---------- 不同次對比 ----------

  function beanNameOf(b) {
    return brewBeanName(b);
  }

  /** 同一支豆子、同一種沖煮法的記錄（舊到新） */
  function sameBeanBrews(b) {
    return S.all('brews').filter((x) => x.method === b.method &&
      (b.beanId ? x.beanId === b.beanId : !x.beanId && x.beanName && x.beanName === b.beanName))
      .sort((x, y) => String(x.date || '').localeCompare(String(y.date || '')));
  }

  function stagesSummary(stages) {
    return (stages || []).filter((s) => s.amount || C.stageEnd(s) !== null)
      .map((s) => (s.amount ? s.amount + 'g' : '—') + (C.stageEnd(s) !== null ? '/' + C.formatTime(C.stageEnd(s)) : '')).join('、');
  }

  // 對比的項目：[標籤, 取值函式]
  const COMPARE_ROWS = [
    ['評分', (b) => (b.rating ? '★'.repeat(b.rating) : '')],
    ['粉量', (b) => (b.dose ? b.dose + 'g' : '')],
    ['水粉比', (b) => (b.ratio ? '1:' + b.ratio : '')],
    ['水量', (b) => { const m = METHODS[b.method] || METHODS.pourover; return b[m.out] ? b[m.out] + 'g' : ''; }],
    ['水溫', (b) => (b.temp ? b.temp + '°C' : '')],
    ['研磨', (b) => grindText(b)],
    ['器具', (b) => b.dripper || ''],
    ['分段', (b) => stagesSummary(b.stages)],
    ['總時間', (b) => b.totalTime || ''],
    ['目標時間', (b) => b.targetTime || ''],
    ['酸', (b) => b.acidity || ''],
    ['甜', (b) => b.sweetness || ''],
    ['苦', (b) => b.bitterness || ''],
    ['醇厚', (b) => b.body || ''],
    ['風味', (b) => b.flavorNotes || ''],
    ['下次調整', (b) => b.nextTime || ''],
  ];

  /** 跟同一支豆子的上一杯比，只列出有變的項目 */
  function prevCompare(b) {
    const list = sameBeanBrews(b);
    const i = list.findIndex((x) => x.id === b.id);
    const prev = i > 0 ? list[i - 1] : null;
    if (!prev) return '';
    const rows = COMPARE_ROWS.filter(([label]) => !['風味', '下次調整'].includes(label))
      .map(([label, get]) => [label, String(get(prev)), String(get(b))])
      .filter(([, a, c]) => a !== c);
    return `<section class="card"><div class="card-head"><h2>跟上一杯比</h2><a class="small" href="#/compare?brew=${b.id}">全部對比（${list.length}）</a></div>
      <p class="muted small">上一杯：<a href="#/brew/${prev.id}">${esc(fmtDate(prev.date))}</a>${prev.nextTime ? `，當時想調整：${esc(prev.nextTime)}` : ''}</p>
      ${rows.length ? `<table class="table diff-table"><thead><tr><th>項目</th><th>上一杯</th><th>這杯</th></tr></thead>
        <tbody>${rows.map(([l, a, c]) => `<tr><td>${l}</td><td class="muted">${esc(a) || '—'}</td><td><b>${esc(c) || '—'}</b></td></tr>`).join('')}</tbody></table>`
        : '<p class="muted small">參數跟上一杯一樣。</p>'}
    </section>`;
  }

  /** 同一支豆子的所有記錄並排比較，跟前一杯不同的格子標出來 */
  function renderCompare(q) {
    const b = S.get('brews', q.get('brew'));
    if (!b) return notFound();
    const list = sameBeanBrews(b).slice(-10);
    const best = list.reduce((acc, x) => (x.isBest ? x : !acc || (!acc.isBest && (x.rating || 0) > (acc.rating || 0)) ? x : acc), null);
    mount(`<div class="page">
      ${header('對比：' + beanNameOf(b), { back: '#/brew/' + b.id })}
      <p class="muted small">${METHODS[b.method].label}，共 ${list.length} 杯（舊 → 新）。<span class="chg-key">黃底</span>＝跟前一杯不同，<span class="best">★ 欄</span>＝最佳／評分最高。</p>
      <div class="scroll-x compare"><table class="table">
        <thead><tr><th></th>${list.map((x) => `<th class="${x === best ? 'bestcol' : ''}"><a href="#/brew/${x.id}">${esc(fmtDate(x.date))}</a>${x === best ? ' <span class="best">★</span>' : ''}</th>`).join('')}</tr></thead>
        <tbody>${COMPARE_ROWS.map(([label, get]) => `<tr><th>${label}</th>${list.map((x, i) => {
          const v = String(get(x));
          const changed = i > 0 && v !== String(get(list[i - 1]));
          return `<td class="${changed ? 'chg' : ''} ${x === best ? 'bestcol' : ''}">${esc(v) || '—'}</td>`;
        }).join('')}</tr>`).join('')}</tbody>
      </table></div>
      <div class="actions"><a class="btn primary" href="#/brew/new?from=${(best || b).id}">用${best ? '最好的一杯' : '這杯'}再沖一次</a></div>
    </div>`);
  }

  function recipeLine(b) {
    const r = b.recipeKey && C.MASTER_RECIPES.find((x) => x.key === b.recipeKey);
    return r ? `<p class="muted small">參考配方：${esc(r.name)} · ${sourceLink(r)}</p>` : '';
  }

  function recipeMeta(r) {
    return `${METHODS[r.method].label} · ${r.dose}g / ${r.water}g（1:${C.round(r.water / r.dose, 0.1)}）· ${r.temp}°C · 研磨${r.grind} · ${r.totalTime}`;
  }

  function sourceLink(r) {
    return `<a href="${esc(r.source.url)}" target="_blank" rel="noopener">${esc(r.source.label)}</a>`;
  }

  function stagesTable(stages) {
    if (!stages || !stages.length) return '';
    const cum = C.cumulative(stages);
    return `<table class="table stages-table">
      <thead><tr><th>段</th><th class="r">注水</th><th class="r">累計</th><th class="r">結束</th></tr></thead>
      <tbody>${stages.map((s, i) => `<tr>
        <td>${esc(s.label || `第 ${i + 1} 段`)}${s.technique ? `<div class="muted small">${esc(s.technique)}</div>` : ''}</td>
        <td class="r mono">${s.amount ? esc(s.amount) + 'g' : '—'}</td>
        <td class="r mono">${cum[i]}g</td>
        <td class="r mono">${C.stageEnd(s) !== null ? C.formatTime(C.stageEnd(s)) : '—'}</td></tr>`).join('')}</tbody></table>`;
  }

  // ---------- 路由 ----------

  function route() {
    if (cleanup) { cleanup(); cleanup = null; }
    if (!EMBED) currentHash = location.hash || '#/brews';
    const h = currentHash.slice(1) || '/brews';
    const [path, qs] = h.split('?');
    const [a, b, c] = path.split('/').filter(Boolean);
    const q = new URLSearchParams(qs || '');
    let tab = a;

    if (a === 'brews') renderBrewList(q);
    else if (a === 'brew') {
      tab = 'brews';
      if (b === 'new') renderBrewForm(null, q);
      else if (c === 'edit') renderBrewForm(b, q);
      else renderBrewDetail(b);
    } else if (a === 'beans') renderBeanList(q);
    else if (a === 'bean') {
      tab = 'beans';
      if (b === 'new') renderBeanForm(null);
      else if (c === 'edit') renderBeanForm(b);
      else renderBeanDetail(b);
    } else if (a === 'timer') renderTimer(b);
    else if (a === 'tools') renderTools(q);
    else if (a === 'settings') renderSettings();
    else if (a === 'compare') { tab = 'brews'; renderCompare(q); }
    else if (a === 'grinder') { tab = 'settings'; renderGrinderForm(b === 'new' ? null : b); }
    else { go('#/brews', true); return; }

    $$('.tabbar a').forEach((el) => el.classList.toggle('active', el.dataset.tab === tab));
    window.scrollTo(0, 0);
  }

  // ---------- 沖煮記錄列表 ----------

  function renderBrewList(q) {
    const method = q.get('m') || '';
    const beanId = q.get('bean') || '';
    const link = (m, bn) => '#/brews?' + new URLSearchParams(Object.entries({ m, bean: bn }).filter((e) => e[1])).toString();
    let brews = S.all('brews').slice().sort(byDateDesc);
    if (method) brews = brews.filter((b) => b.method === method);
    if (beanId) brews = brews.filter((b) => b.beanId === beanId);
    const beans = S.all('beans').slice().sort((x, y) => x.name.localeCompare(y.name, 'zh-Hant'));

    const page = mount(`<div class="page">
      ${header('沖煮記錄', { action: `<a class="btn primary small" href="#/brew/new${method ? '?m=' + method : ''}">＋ 新增</a>` })}
      <div class="chips scroll">
        <a class="chip ${!method ? 'on' : ''}" href="${link('', beanId)}">全部</a>
        ${METHOD_KEYS.map((k) => `<a class="chip ${method === k ? 'on' : ''}" href="${link(k, beanId)}">${METHODS[k].label}</a>`).join('')}
      </div>
      ${beans.length ? `<select class="filter" id="bean-filter">
        <option value="">所有豆子</option>
        ${beans.map((b) => `<option value="${b.id}" ${b.id === beanId ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}
      </select>` : ''}
      <div class="list">${brews.length ? brews.map((b) => brewCard(b)).join('') : emptyBrews()}</div>
    </div>`);

    const sel = $('#bean-filter', page);
    if (sel) sel.addEventListener('change', () => { go(link(method, sel.value)); });
  }

  function emptyBrews() {
    const fresh = !S.all('brews').length && !S.all('beans').length;
    return `<div class="empty">
      <p>${fresh ? '還沒有任何記錄。' : '沒有符合條件的記錄。'}</p>
      ${fresh ? `<p>建議順序：先到「設定」加入你的磨豆機 → 「豆子」新增一支豆子 → 回來新增第一筆沖煮。</p>
        <p><a class="btn" href="#/settings">前往設定</a> <a class="btn primary" href="#/brew/new">新增記錄</a></p>` : ''}
    </div>`;
  }

  // ---------- 沖煮記錄詳細 ----------

  function renderBrewDetail(id) {
    const b = S.get('brews', id);
    if (!b) return notFound();
    const m = METHODS[b.method] || METHODS.pourover;
    const bean = S.get('beans', b.beanId);
    const g = S.get('grinders', b.grinderId);
    const mic = C.grinderMicrons(g, b.grindSetting);
    const rd = bean ? C.restDays(bean.roastDate, b.date) : null;

    const stats = [
      ['粉量', b.dose ? b.dose + ' g' : ''],
      ['水粉比', b.ratio ? '1:' + b.ratio : ''],
      [m.outLabel, b[m.out] ? b[m.out] + ' g' : ''],
      ['總時間', b.totalTime],
      ['目標時間', b.targetTime],
      ['研磨', grindText(b) + (mic !== null ? `（≈${mic}µm）` : '')],
    ].concat((EXTRA[b.method] || []).map(([f, label]) => [label, b[f]]))
      .concat([['養豆天數', rd !== null ? rd + ' 天' : '']])
      .filter((s) => s[1] !== '' && s[1] !== null && s[1] !== undefined);

    const tasteBars = TASTE.filter(([k]) => b[k]).map(([k, l]) =>
      `<div class="bar"><span>${l}</span><div class="track"><div style="width:${b[k] * 20}%"></div></div><b>${b[k]}</b></div>`).join('');

    const page = mount(`<div class="page">
      ${header(brewBeanName(b), { back: '#/brews', action: `<a class="btn small" href="#/brew/${id}/edit">編輯</a>` })}
      <div class="row sub">${methodTag(b.method)}<span class="muted">${esc(fmtDate(b.date))}</span>${b.isBest ? '<span class="best">★ 最佳配方</span>' : ''}</div>
      <section class="card"><div class="stats">${stats.map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>${adviceLine(b)}</section>
      ${b.stages && b.stages.length ? `<section class="card"><h2>分段注水</h2>${stagesTable(b.stages)}${recipeLine(b)}${b.suggestBasis ? `<p class="muted small">建議依據：${esc(b.suggestBasis)}</p>` : ''}</section>` : ''}
      ${prevCompare(b)}
      <section class="card"><h2>風味</h2>
        <div class="big-stars">${stars(b.rating)}</div>
        ${tasteBars ? `<div class="bars">${tasteBars}</div>` : ''}
        ${b.flavorNotes ? `<p><b>風味：</b>${esc(b.flavorNotes)}</p>` : ''}
        ${b.notes ? `<p><b>心得：</b>${esc(b.notes)}</p>` : ''}
        ${b.nextTime ? `<p class="note"><b>下次調整：</b>${esc(b.nextTime)}</p>` : ''}
      </section>
      <div class="actions">
        <a class="btn primary" href="#/timer/${id}">⏱ 跟著計時沖</a>
        <a class="btn" href="#/brew/new?from=${id}">再沖一次</a>
        <button class="btn" data-act="best">${b.isBest ? '取消最佳配方' : '★ 設為最佳配方'}</button>
        ${bean ? `<a class="btn ghost" href="#/bean/${bean.id}">看這支豆子</a>` : ''}
        <button class="btn danger ghost" data-act="del">刪除</button>
      </div>
    </div>`);

    page.addEventListener('click', async (e) => {
      const act = e.target.closest('[data-act]');
      if (!act) return;
      if (act.dataset.act === 'best') {
        S.toggleBest(id);
        toast(S.get('brews', id).isBest ? `已設為這支豆子的${m.label}最佳配方` : '已取消最佳配方');
        renderBrewDetail(id);
      } else if (act.dataset.act === 'del' && await ask('確定刪除這筆記錄？', '刪除', true)) {
        S.remove('brews', id);
        go('#/brews');
      }
    });
  }

  // ---------- 新增 / 編輯沖煮記錄 ----------

  const blankStage = () => ({ amount: null, end: null });

  function methodDefaults(method, dose) {
    const m = METHODS[method];
    const d = { method, dose: dose || m.dose, ratio: m.ratio };
    d[m.out] = C.waterFromDose(d.dose, d.ratio);
    if (m.temp) d.temp = m.temp;
    d.stages = m.stages ? [blankStage()] : [];
    return d;
  }

  function newDraft(q) {
    const brews = S.all('brews').slice().sort(byDateDesc);
    const last = brews[0];
    const from = q.get('from') && S.get('brews', q.get('from'));
    let d;
    if (q.get('pending') && pending) {
      d = Object.assign(methodDefaults(pending.method || 'pourover'), pending);
      pending = null;
    } else if (from) {
      d = { beanId: from.beanId, beanName: from.beanName, stages: clone(from.stages || []) };
      RECIPE_FIELDS.forEach((f) => { if (from[f] !== undefined) d[f] = from[f]; });
    } else {
      const method = METHODS[q.get('m')] ? q.get('m') : (last && last.method) || 'pourover';
      d = methodDefaults(method);
      d.beanId = q.get('bean') || '';
      d.grinderId = (last && last.grinderId) || (S.all('grinders')[0] || {}).id || '';
      // 同一支豆子、同沖煮法有最佳配方時直接帶入
      const best = d.beanId && bestBrew(d.beanId, method);
      if (best) {
        RECIPE_FIELDS.forEach((f) => { if (best[f] !== undefined) d[f] = best[f]; });
        d.stages = clone(best.stages || []);
      }
    }
    if (q.get('time')) d.totalTime = C.formatTime(+q.get('time'));
    d.date = nowLocal();
    return d;
  }

  function renderBrewForm(id, q) {
    const editing = id ? S.get('brews', id) : null;
    if (id && !editing) return notFound();
    const d = editing ? clone(editing) : newDraft(q);
    d.stages = C.migrateStages(d.stages || [], d.totalTime);
    let autoScale = true;
    let addBean = true; // 輸入新的豆子名稱時，儲存時加入常用
    let addGrinder = true;
    let grindNote = '';
    let page;

    function draw() {
      page = mount(formHtml());
      bind();
      if (METHODS[d.method].stages) renderStages();
      updateBeanHint();
      updateGrindHint();
      updateRatioHint();
      updateRecipeHint();
      updateSuggestHint();
      updateTimeHint();
    }

    function formHtml() {
      const m = METHODS[d.method];
      const bean = S.get('beans', d.beanId);
      const grinder = S.get('grinders', d.grinderId);
      const beans = S.all('beans').filter((b) => !b.archived || b.id === d.beanId)
        .sort((x, y) => x.name.localeCompare(y.name, 'zh-Hant'));
      const grinderNames = S.all('grinders').map((g) => g.name)
        .concat(C.GRINDER_PRESETS.map((p) => p.name).filter((n) => !findByName('grinders', n)));
      const extras = (EXTRA[d.method] || []).map(([f, label, ph, isNum]) =>
        field(label, isNum ? numInput(f, d[f], `placeholder="${ph}"`) : `<input data-f="${f}" value="${esc(d[f])}" placeholder="${esc(ph)}">`)).join('');

      return `<div class="page">
        ${header(editing ? '編輯記錄' : '新增記錄', { back: editing ? '#/brew/' + editing.id : '#/brews' })}
        <form id="brew-form" autocomplete="off">
          <section class="card">
            <div class="seg">${METHOD_KEYS.map((k) => `<label><input type="radio" name="method" value="${k}" data-f="method" ${d.method === k ? 'checked' : ''}><span>${METHODS[k].label}</span></label>`).join('')}</div>
            <div>
              ${field('日期時間', `<input type="datetime-local" data-f="date" value="${esc(d.date)}">`)}
              ${field('豆子', `<input data-f="beanText" list="bean-list" value="${esc(bean ? bean.name : d.beanName)}" placeholder="輸入或選擇豆子">`)}
            </div>
            <div id="bean-hint" class="hint"></div>
          </section>

          <section class="card"><h2>研磨</h2>
            <div class="grid2">
              ${field('磨豆機', `<input data-f="grinderText" list="grinder-list" value="${esc(grinder ? grinder.name : d.grinderName)}" placeholder="輸入或選擇">`)}
              ${field('刻度', `<input data-f="grindSetting" inputmode="decimal" value="${esc(d.grindSetting)}" placeholder="例：24">`)}
            </div>
            <div id="grind-hint" class="hint"></div>
          </section>

          <section class="card"><h2>比例與參數</h2>
            <div class="grid3">
              ${field('粉量 g', numInput('dose', d.dose))}
              ${field('水粉比 1:', numInput('ratio', d.ratio))}
              ${field(m.outLabel + ' g', numInput(m.out, d[m.out]))}
            </div>
            <div id="ratio-hint" class="hint"></div>
            <div class="grid2">
              ${extras}
              ${field(d.method === 'espresso' ? '萃取時間' : '總時間', `<input data-f="totalTime" value="${esc(d.totalTime)}" placeholder="${d.method === 'espresso' ? '0:28' : '2:45'}" inputmode="numeric">`)}
              ${m.stages ? field('目標時間', `<input data-f="targetTime" value="${esc(d.targetTime)}" placeholder="3:00" inputmode="numeric">`) : ''}
            </div>
            <div id="time-hint" class="hint"></div>
          </section>

          ${m.stages ? `<section class="card">
            <div class="card-head"><h2>分段注水</h2>
              <label class="check"><input type="checkbox" id="auto-scale" ${autoScale ? 'checked' : ''}> 隨水量等比例調整</label></div>
            <p class="muted small stage-help">每段填注水克數，和這段<b>結束</b>的秒數（例：30 或 1:30）。</p>
            ${d.method === 'pourover' ? `<div class="suggest-row">
              <button type="button" class="btn small" data-act="suggest">建議分段</button>
              <select id="suggest-style" aria-label="建議的依據">
                <option value="auto">自動（先找我的記錄）</option>
                ${Object.entries(C.SUGGEST_STYLES).map(([k, st]) => `<option value="${k}">${st.label}</option>`).join('')}
              </select>
            </div>
            <div id="suggest-hint" class="hint"></div>` : ''}
            <div id="stages"></div>
            <button type="button" class="btn ghost block" data-act="add-stage">＋ 手動新增</button>
            <div id="stage-sum" class="hint"></div>
            <div id="recipe-hint" class="hint"></div>
            <details class="tpl"><summary>套用範本（大師配方 / 通用）</summary>
              <div class="recipe-picks">${C.MASTER_RECIPES.map((r) => `<button type="button" class="recipe-pick" data-act="master" data-k="${r.key}">
                <strong>${esc(r.name)}</strong><span class="muted small">${esc(recipeMeta(r))}</span></button>`).join('')}</div>
              <p class="muted small">套用後依你的粉量等比例換算水量，時間點照原配方。</p>
              <div class="chips"><span class="muted small">通用：</span>${Object.entries(C.POUR_TEMPLATES).map(([k, t]) => `<button type="button" class="chip" data-act="tpl" data-k="${k}">${t.label}</button>`).join('')}</div>
            </details>
          </section>` : ''}

          <section class="card"><h2>風味</h2>
            <div class="star-input">${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="star ${n <= (d.rating || 0) ? 'on' : ''}" data-act="rate" data-n="${n}" aria-label="${n} 星">★</button>`).join('')}</div>
            ${TASTE.map(([k, l]) => `<label class="slider"><span>${l}</span><input type="range" min="0" max="5" step="1" data-f="${k}" value="${d[k] || 0}"><output id="o-${k}">${d[k] || '—'}</output></label>`).join('')}
            ${field('風味描述', `<input data-f="flavorNotes" value="${esc(d.flavorNotes)}" placeholder="柑橘、花香、焦糖…">`)}
            ${field('心得', `<textarea data-f="notes" rows="2" placeholder="這杯喝起來如何？">${esc(d.notes)}</textarea>`)}
            ${field('下次調整', `<textarea data-f="nextTime" rows="2" placeholder="例：磨細 2 格、水溫降到 90°C">${esc(d.nextTime)}</textarea>`)}
          </section>

          <div class="form-actions">
            <a class="btn ghost" href="${editing ? '#/brew/' + editing.id : '#/brews'}">取消</a>
            <button class="btn primary" type="submit">儲存</button>
          </div>
        </form>
        <datalist id="bean-list">${beans.map((b) => `<option value="${esc(b.name)}">`).join('')}</datalist>
        <datalist id="grinder-list">${grinderNames.map((n) => `<option value="${esc(n)}">`).join('')}</datalist>
        <datalist id="tech-list">${TECHNIQUES.map((t) => `<option value="${t}">`).join('')}</datalist>
      </div>`;
    }

    function stageRow(s, i) {
      const detail = !!(s.label || s.technique);
      const prevEnd = i > 0 ? C.stageEnd(d.stages[i - 1]) : null;
      return `<div class="stage" data-i="${i}">
        <div class="stage-line">
          <span class="stage-no">${i + 1}</span>
          <label class="mini"><input type="number" step="any" inputmode="decimal" data-sf="amount" value="${esc(s.amount)}" placeholder="注水" aria-label="第 ${i + 1} 段注水克數"><span>g</span></label>
          <label class="mini"><input data-sf="end" inputmode="numeric" value="${esc(s.end)}" placeholder="${prevEnd !== null ? prevEnd + 30 : 30}" aria-label="第 ${i + 1} 段結束秒數"><span>秒</span></label>
          <button type="button" class="icon-btn" data-act="more-stage" aria-expanded="${detail}" aria-label="詳細方式（選填）" title="詳細方式（選填）">⋯</button>
          <button type="button" class="icon-btn" data-act="del-stage" aria-label="刪除這段">✕</button>
        </div>
        <div class="stage-sub muted small"></div>
        <div class="stage-more" ${detail ? '' : 'hidden'}>
          <input data-sf="label" value="${esc(s.label)}" placeholder="段落名稱（選填，例：悶蒸）">
          <input data-sf="technique" list="tech-list" value="${esc(s.technique)}" placeholder="手法（選填）：繞圈 / 中心注水…">
        </div>
      </div>`;
    }

    function renderStages() {
      $('#stages', page).innerHTML = d.stages.map(stageRow).join('');
      updateStageSum();
    }

    function updateStageSum() {
      const el = $('#stage-sum', page);
      if (!el) return;
      const cum = C.cumulative(d.stages);
      $$('.stage', page).forEach((row, i) => {
        const end = C.stageEnd(d.stages[i]);
        $('.stage-sub', row).textContent = `累計 ${cum[i]} g` + (end !== null ? ` · ${C.formatTime(end)} 結束` : '');
      });
      const sum = C.stagesTotal(d.stages);
      const water = C.num(d.water);
      const off = water !== null && sum > 0 && Math.abs(sum - water) > 0.5;
      el.className = 'hint' + (off ? ' warn' : '');
      el.innerHTML = sum > 0 ? `分段合計 <b>${sum}</b> g${water !== null ? ` / 總水量 ${water} g` : ''}${off ? '（不一致）' : ''}` : '';
    }

    function setVal(f, v) {
      const el = page.querySelector(`[data-f="${f}"]`);
      if (el && el !== document.activeElement) el.value = v === null || v === undefined ? '' : v;
    }

    function updateBeanHint() {
      const el = $('#bean-hint', page);
      const bean = S.get('beans', d.beanId);
      if (!bean) {
        el.innerHTML = d.beanName
          ? `<label class="check"><input type="checkbox" id="add-bean" ${addBean ? 'checked' : ''}> 「${esc(d.beanName)}」加入常用豆子</label>`
          : '';
        return;
      }
      const parts = [];
      const rd = C.restDays(bean.roastDate, d.date);
      if (rd !== null) parts.push(`養豆第 <b>${rd}</b> 天`);
      const rem = remaining(bean);
      if (rem !== null) parts.push(`剩餘約 <b>${rem}</b> g`);
      let html = parts.length ? `<div>${parts.join(' · ')}</div>` : '';
      const prev = beanBrews(bean.id).filter((b) => b.id !== d.id && b.nextTime)[0];
      if (prev) html += `<div class="note">上次（${esc(fmtDate(prev.date))}）想調整：${esc(prev.nextTime)}</div>`;
      const best = bestBrew(bean.id, d.method, d.id);
      if (best) html += `<button type="button" class="btn small" data-act="apply-best" data-id="${best.id}">套用${best.isBest ? '最佳' : '評分最高'}配方：${esc(summary(best))}</button>`;
      el.innerHTML = html;
    }

    function updateGrindHint() {
      const el = $('#grind-hint', page);
      const g = S.get('grinders', d.grinderId);
      if (!g) {
        if (d.grinderName) {
          const p = presetByName(d.grinderName);
          el.innerHTML = `<label class="check"><input type="checkbox" id="add-grinder" ${addGrinder ? 'checked' : ''}> 「${esc(d.grinderName)}」加入常用磨豆機${p ? `（帶入每格約 ${p.micronsPerStep} µm，可換算刻度）` : ''}</label>`;
        } else {
          el.innerHTML = S.all('grinders').length ? '' : '輸入磨豆機名稱，儲存時會加入常用；之後換磨豆機能自動換算刻度。';
        }
        return;
      }
      if (!C.canConvert(g)) {
        el.innerHTML = `這台磨豆機還沒設定「每格微米」，<a href="#/grinder/${g.id}/edit">設定後</a>即可換算刻度。`;
        return;
      }
      let html = grindNote ? `<div>${esc(grindNote)}</div>` : '';
      const mic = C.grinderMicrons(g, d.grindSetting);
      if (mic !== null) {
        const ms = C.methodsForMicrons(mic).map((r) => r.label);
        html += `<div>≈ <b>${mic}</b> µm${ms.length ? ' · 落在：' + ms.join('、') + ' 範圍' : ''}</div>`;
      }
      const r = C.grinderRangeTable(g).find((x) => x.key === METHODS[d.method].range);
      if (r) html += `<div class="muted">${METHODS[d.method].label}參考範圍：${r.from}–${r.to} ${esc(unitOf(g))}</div>`;
      el.innerHTML = html;
    }

    /** 「自動」建議時找參考記錄：這支豆子的最佳配方 → 同烘焙度豆子裡評分 4 星以上的一杯 */
    function findReference() {
      const bean = S.get('beans', d.beanId);
      if (!bean) return null;
      const best = bestBrew(bean.id, d.method, d.id);
      if (best && best.stages && best.stages.length) {
        return { brew: best, text: `${bean.name} 的${best.isBest ? '最佳配方' : '評分最高的一杯'}（${fmtDate(best.date)}${best.rating ? '，' + '★'.repeat(best.rating) : ''}）` };
      }
      if (!bean.roast) return null;
      const similar = S.all('brews').filter((b) => {
        const other = S.get('beans', b.beanId);
        return b.id !== d.id && b.method === d.method && (b.rating || 0) >= 4 && b.stages && b.stages.length && other && other.roast === bean.roast;
      }).sort((x, y) => {
        const px = S.get('beans', x.beanId).process === bean.process ? 1 : 0;
        const py = S.get('beans', y.beanId).process === bean.process ? 1 : 0;
        return py - px || y.rating - x.rating || byDateDesc(x, y);
      })[0];
      return similar ? { brew: similar, text: `同為${bean.roast}的 ${beanNameOf(similar)}（${fmtDate(similar.date)}，${'★'.repeat(similar.rating)}）` } : null;
    }

    function updateSuggestHint() {
      const el = $('#suggest-hint', page);
      if (el) el.innerHTML = d.suggestBasis ? `<div>依據：${esc(d.suggestBasis)}</div>` : '';
    }

    function updateTimeHint() {
      const el = $('#time-hint', page);
      if (!el) return;
      const adv = C.timeAdvice(d.targetTime, d.totalTime);
      el.className = 'hint' + (adv && adv.level !== 'ok' ? ' warn' : '');
      el.textContent = adv ? `目標 ${d.targetTime}，實際 ${d.totalTime}：${adv.text}` : '';
    }

    function updateRecipeHint() {
      const el = $('#recipe-hint', page);
      if (!el) return;
      const r = C.MASTER_RECIPES.find((x) => x.key === d.recipeKey);
      el.innerHTML = r
        ? `<div>參考 <b>${esc(r.name)}</b>（原配方 ${r.dose}g / ${r.water}g，研磨${esc(r.grind)}）· ${sourceLink(r)}</div>${r.note ? `<div>${esc(r.note)}</div>` : ''}`
        : '';
    }

    function updateRatioHint() {
      const el = $('#ratio-hint', page);
      if (d.method === 'espresso') {
        el.innerHTML = '常見比例：Ristretto 1:1–1.5 · 標準 1:2 · Lungo 1:3';
      } else if (d.method === 'moka') {
        el.innerHTML = '摩卡壺粉槽裝滿抹平（不壓實），水加到洩壓閥下方；常見約 1:7–1:10。';
      } else {
        const bev = C.estimatedBeverage(d.water, d.dose);
        el.innerHTML = bev !== null ? `預估萃取液約 <b>${bev}</b> g（咖啡粉約吸 2 倍水）` : '';
      }
    }

    function onOutChanged() {
      if (!METHODS[d.method].stages || !autoScale) return;
      if (C.stagesTotal(d.stages) > 0 && C.num(d.water)) {
        d.stages = C.scaleStages(d.stages, d.water);
        renderStages();
      }
    }

    function applyRecipe(src) {
      RECIPE_FIELDS.forEach((f) => { if (src[f] !== undefined) d[f] = src[f]; });
      d.stages = C.migrateStages(clone(src.stages || []), src.totalTime);
    }

    function onInput(e) {
      const t = e.target;
      const isText = t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && !['checkbox', 'radio'].includes(t.type));
      if ((e.type === 'change') === isText) return; // 文字類用 input 事件、選單與勾選用 change 事件

      if (t.id === 'auto-scale') { autoScale = t.checked; return; }
      if (t.id === 'add-bean') { addBean = t.checked; return; }
      if (t.id === 'add-grinder') { addGrinder = t.checked; return; }

      if (t.dataset.sf) {
        const s = d.stages[+t.closest('.stage').dataset.i];
        const k = t.dataset.sf;
        s[k] = k === 'amount' ? C.num(t.value) : k === 'end' ? C.parseTime(t.value) : t.value;
        updateStageSum();
        return;
      }

      const f = t.dataset.f;
      if (!f) return;
      const out = METHODS[d.method].out;

      if (f === 'method') {
        const keep = { beanId: d.beanId, beanName: d.beanName, grinderId: d.grinderId, grinderName: d.grinderName, grindSetting: d.grindSetting };
        Object.assign(d, methodDefaults(t.value), keep);
        const best = d.beanId && bestBrew(d.beanId, d.method, d.id);
        if (best) applyRecipe(best);
        draw();
        return;
      }

      if (f === 'beanText') {
        const match = findByName('beans', t.value);
        d.beanId = match ? match.id : '';
        d.beanName = match ? '' : t.value.trim();
        updateBeanHint();
        return;
      }

      if (f === 'grinderText') {
        const prev = S.get('grinders', d.grinderId);
        const next = findByName('grinders', t.value);
        d.grinderId = next ? next.id : '';
        d.grinderName = next ? '' : t.value.trim();
        grindNote = '';
        if (prev && next && prev !== next && d.grindSetting) {
          const conv = C.convertGrind(prev, d.grindSetting, next);
          if (conv !== null) {
            grindNote = `已由 ${prev.name} ${d.grindSetting} ${unitOf(prev)} 自動換算`;
            d.grindSetting = String(conv);
            setVal('grindSetting', conv);
          }
        }
        updateGrindHint();
        return;
      }

      if (TASTE_KEYS.has(f)) {
        d[f] = C.num(t.value) || null;
        $('#o-' + f, page).textContent = d[f] || '—';
        return;
      }

      d[f] = NUM_FIELDS.has(f) ? C.num(t.value) : t.value;

      if (f === 'date') updateBeanHint();
      if (f === 'grindSetting') { grindNote = ''; updateGrindHint(); }
      if (f === 'dose' || f === 'ratio') {
        const v = C.waterFromDose(d.dose, d.ratio);
        if (v !== null) { d[out] = v; setVal(out, v); onOutChanged(); }
      } else if (f === out) {
        const r = C.ratioOf(d.dose, d[out]);
        if (r !== null) { d.ratio = r; setVal('ratio', r); }
        onOutChanged();
      }
      if (f === 'totalTime' || f === 'targetTime') updateTimeHint();
      updateRatioHint();
      updateStageSum();
    }

    async function onClick(e) {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;
      if (act === 'suggest') {
        const style = $('#suggest-style', page).value;
        const ref = style === 'auto' ? findReference() : null;
        const bean = S.get('beans', d.beanId);
        const sug = C.suggestStages({
          dose: d.dose, water: d.water, style: style === 'auto' ? '60-40' : style,
          roast: bean && bean.roast, reference: ref && ref.brew,
        });
        if (!sug) return toast('請先填粉量與水量');
        const filled = d.stages.some((s) => s.amount || C.stageEnd(s) !== null);
        if (filled && !await ask('以建議的分段取代目前的分段？', '取代')) return;
        d.stages = sug.stages;
        d.targetTime = sug.targetTime;
        setVal('targetTime', sug.targetTime);
        if (sug.temp) { d.temp = sug.temp; setVal('temp', sug.temp); }
        const st = C.SUGGEST_STYLES[sug.basis];
        d.suggestBasis = ref ? ref.text : `通用經驗法則 ${st.label}：${st.note}` +
          (sug.temp && bean && bean.roast ? `；水溫依${bean.roast}建議 ${sug.temp}°C` : '');
        delete d.recipeKey;
        delete d.recipeName;
        renderStages();
        updateRecipeHint();
        updateSuggestHint();
        updateTimeHint();
        toast('已填入建議，可以再手動調整');
      } else if (act === 'master') {
        const r = C.MASTER_RECIPES.find((x) => x.key === b.dataset.k);
        const filled = d.stages.some((s) => s.amount || C.stageEnd(s) !== null);
        if (filled && !await ask(`以「${r.name}」取代目前的分段與比例？`, '套用')) return;
        const a = C.applyMasterRecipe(r.key, d.dose);
        if (d.dripper) delete a.dripper;
        Object.assign(d, a);
        delete d.suggestBasis;
        draw();
        toast(`已套用 ${r.name}`);
      } else if (act === 'tpl') {
        const t = C.POUR_TEMPLATES[b.dataset.k];
        const filled = d.stages.some((s) => s.amount || C.stageEnd(s) !== null);
        if (filled && !await ask(`以「${t.label}」取代目前的分段？`, '取代')) return;
        const built = C.buildTemplate(b.dataset.k, d.dose, d.water);
        if (!built.length) return toast('請先填粉量與水量');
        d.stages = built;
        delete d.recipeKey;
        delete d.recipeName;
        delete d.suggestBasis;
        renderStages();
        updateRecipeHint();
        updateSuggestHint();
      } else if (act === 'add-stage') {
        d.stages.push(blankStage());
        renderStages();
        const rows = $$('.stage', page);
        $('[data-sf="amount"]', rows[rows.length - 1]).focus();
      } else if (act === 'more-stage') {
        const more = $('.stage-more', b.closest('.stage'));
        more.hidden = !more.hidden;
        b.setAttribute('aria-expanded', String(!more.hidden));
        if (!more.hidden) $('input', more).focus();
      } else if (act === 'del-stage') {
        d.stages.splice(+b.closest('.stage').dataset.i, 1);
        renderStages();
      } else if (act === 'rate') {
        const n = +b.dataset.n;
        d.rating = d.rating === n ? null : n;
        $$('.star', page).forEach((s) => s.classList.toggle('on', +s.dataset.n <= (d.rating || 0)));
      } else if (act === 'apply-best') {
        applyRecipe(S.get('brews', b.dataset.id));
        draw();
        toast('已套用配方');
      }
    }

    function onSubmit(e) {
      e.preventDefault();
      const rec = clone(d);
      // 新輸入的豆子 / 磨豆機：勾選「加入常用」就建立
      if (!rec.beanId && rec.beanName && addBean) rec.beanId = S.upsert('beans', { name: rec.beanName }).id;
      if (rec.beanId || !rec.beanName) delete rec.beanName;
      if (!rec.grinderId && rec.grinderName && addGrinder) {
        const p = presetByName(rec.grinderName);
        rec.grinderId = S.upsert('grinders', p
          ? { name: p.name, unit: '格', micronsPerStep: p.micronsPerStep, zeroMicrons: p.zeroMicrons, precision: p.precision, notes: '預設參考值，可依實際校正' }
          : { name: rec.grinderName, unit: '格', precision: 1, zeroMicrons: 0 }).id;
      }
      if (rec.grinderId || !rec.grinderName) delete rec.grinderName;

      rec.stages = (rec.stages || []).filter((s) => s.amount || C.stageEnd(s) !== null || s.label || s.technique);
      rec.stages.forEach((s) => {
        s.end = C.stageEnd(s);

      if (!METHODS[rec.method].stages) rec.stages = [];

      }
      S.upsert('brews', rec);
      go('#/brew/' + rec.id);

    function bind() {

      form.addEventListener('input', onInput);
      form.addEventListener('change', onInput);

    }

    draw();
  }

  // ---------- 照片 ----------

  async function useCap(name) {
    if (!CLAUDE || !(window.claude && window.claude.use)) return null;
    try { return await window.claude.use(name); } catch (e) { return null; }
  }

  /** 刪除豆子照片檔（claude.ai 的檔案或試算表的照片分頁）；data URL 不用處理 */
  async function deletePhoto(ref) {
    if (!ref) return;
    if (ref.photoKey && SHEET) S.gas('deletePhoto', ref.photoKey).catch(() => {});
    if (ref.photoId) {
      const assets = await useCap('assets');
      if (assets) assets.delete(ref.photoId).catch(() => {});
    }
  }

  const samePhoto = (a, b) => !!a && !!b && ((a.photoId && a.photoId === b.photoId) || (a.photoKey && a.photoKey === b.photoKey));

  /** 縮小照片並轉成 JPEG */
  function shrinkImage(file, maxSide, quality) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * k);
        canvas.height = Math.round(img.naturalHeight * k);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('照片轉換失敗'))), 'image/jpeg', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('無法讀取這張照片')); };
      img.src = url;
    });
  }

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error('照片轉換失敗'));
      r.readAsDataURL(blob);
    });
  }

  /** 這個環境能不能請 Claude 讀照片（claude.ai 頁面才有） */
  async function labelReader() {
    const sample = await useCap('sample');
    if (!sample) return null;
    const caps = await sample.limits().catch(() => null);
    return caps && caps.images ? sample : null;
  }

  const LABEL_PROMPT = `這是一包咖啡豆的包裝或規格卡照片。請讀出上面寫的資訊，只回傳一個 JSON 物件，只放照片上讀得到的欄位，讀不到的就不要放、不要猜：
- name：豆子名稱，例如「衣索比亞 耶加雪菲 G1」
- roaster：烘豆商
- origin：國家、產區、莊園或處理廠
- variety：品種
- process：處理法，例如 水洗、日曬、蜜處理、厭氧發酵
- roast：烘焙度，只能是 極淺焙、淺焙、中淺焙、中焙、中深焙、深焙 其中之一
- roastDate：烘焙日期，格式 YYYY-MM-DD
- weight：淨重，單位克，只填數字
- price：價格
- flavor：風味描述，用頓號分隔
- notes：其他有用的資訊，例如海拔、批次、生產者
文字用繁體中文，品種、莊園等專有名詞可保留原文。
範例：{"name":"肯亞 AA","process":"水洗","roast":"淺焙","weight":200}`;

  function sampleErrorText(e) {
    const code = e && e.code;
    if (code === 'not_granted' || code === 'sampling_disabled') return '沒有允許讀取照片，請手動填寫。';
    if (code === 'rate_limited') return '讀取太頻繁或用量已達上限，請稍後再試或手動填寫。';
    if (code === 'image_rejected') return '這張照片無法讀取，請換一張清楚的照片。';
    if (code === 'cancelled') return '';
    return '沒有讀到規格，請手動填寫。';
  }

  function renderBeanForm(id) {
    const editing = id ? S.get('beans', id) : null;
    if (id && !editing) return notFound();
    const b = editing ? clone(editing) : { roastDate: '' };
    const oldPhoto = editing && hasPhoto(editing) ? { photoId: editing.photoId, photoKey: editing.photoKey } : null;
    const text = (f, label, ph, extra) => field(label, `<input name="${f}" value="${esc(b[f])}" placeholder="${esc(ph || '')}" ${extra || ''}>`);
    let previewSrc = ''; // 這次編輯新選的照片（立即預覽用）
    let reader = null;

    const page = mount(`<div class="page">
